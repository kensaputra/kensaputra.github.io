<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#112240;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d3461;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#64ffda;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4fd1b5;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="200" ry="200"/>
  <text x="200" y="220" font-family="Inter, sans-serif" font-size="120" font-weight="700" fill="url(#text)" text-anchor="middle" dominant-baseline="middle">KS</text>
  <circle cx="200" cy="200" r="195" fill="none" stroke="#64ffda" stroke-width="2" stroke-dasharray="10 5" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="30s" repeatCount="indefinite"/>
  </circle>
</svg>
