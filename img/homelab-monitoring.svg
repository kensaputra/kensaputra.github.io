<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 875" width="1400" height="875" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7aa2ff"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b93a7"/></marker>
  </defs>
  <rect width="1400" height="875" fill="#0f1218"/>
  <text x="70" y="92" fill="#e8ebf2" font-size="40" font-weight="700">Office monitoring stack</text>
  <text x="70" y="134" fill="#8b93a7" font-size="22">docker compose up · scrape every 30 s · 30-day history · alerts to Telegram</text>

  <g font-size="21" fill="#e8ebf2">
    <!-- targets -->
    <rect x="70" y="200" width="270" height="560" rx="18" fill="#161b24" stroke="#2a3140"/>
    <text x="96" y="242" fill="#8b93a7" font-size="17" font-weight="600" letter-spacing="1.5">TARGETS</text>
    <rect x="96" y="272" width="218" height="120" rx="12" fill="#1d2430" stroke="#2a3140"/>
    <text x="118" y="318" font-weight="600">Switches / APs</text><text x="118" y="350" fill="#8b93a7" font-size="18">ping (ICMP)</text>
    <rect x="96" y="420" width="218" height="120" rx="12" fill="#1d2430" stroke="#2a3140"/>
    <text x="118" y="466" font-weight="600">Internal web apps</text><text x="118" y="498" fill="#8b93a7" font-size="18">HTTP + TLS expiry</text>
    <rect x="96" y="568" width="218" height="120" rx="12" fill="#1d2430" stroke="#2a3140"/>
    <text x="118" y="614" font-weight="600">Docker host</text><text x="118" y="646" fill="#8b93a7" font-size="18">CPU · memory · disk</text>

    <!-- exporters -->
    <rect x="420" y="330" width="230" height="110" rx="14" fill="#161b24" stroke="#2a3140"/>
    <text x="444" y="377" font-weight="600">Blackbox exporter</text><text x="444" y="408" fill="#8b93a7" font-size="18">ICMP · HTTP probes</text>
    <rect x="420" y="573" width="230" height="110" rx="14" fill="#161b24" stroke="#2a3140"/>
    <text x="444" y="620" font-weight="600">Node exporter</text><text x="444" y="651" fill="#8b93a7" font-size="18">host metrics</text>

    <!-- prometheus -->
    <rect x="730" y="420" width="240" height="160" rx="16" fill="#1b2a4a" stroke="#7aa2ff" stroke-width="2"/>
    <text x="756" y="472" font-weight="700" font-size="24">Prometheus</text>
    <text x="756" y="506" fill="#b8c7ee" font-size="18">8 alert rules</text>
    <text x="756" y="534" fill="#b8c7ee" font-size="18">30-day retention</text>

    <!-- grafana -->
    <rect x="730" y="210" width="240" height="120" rx="14" fill="#161b24" stroke="#2a3140"/>
    <text x="756" y="258" font-weight="600">Grafana</text><text x="756" y="290" fill="#8b93a7" font-size="18">Office Network Overview</text>

    <!-- alert path -->
    <rect x="1050" y="420" width="280" height="110" rx="14" fill="#161b24" stroke="#2a3140"/>
    <text x="1074" y="467" font-weight="600">Alertmanager</text><text x="1074" y="498" fill="#8b93a7" font-size="18">group · de-duplicate</text>
    <rect x="1050" y="590" width="280" height="110" rx="14" fill="#161b24" stroke="#2a3140"/>
    <text x="1074" y="637" font-weight="600">alert-bridge</text><text x="1074" y="668" fill="#8b93a7" font-size="18">Python · readable messages</text>
    <rect x="1050" y="210" width="280" height="120" rx="14" fill="#1a2e25" stroke="#3fb37f" stroke-width="2"/>
    <text x="1074" y="258" font-weight="700">Telegram</text><text x="1074" y="290" fill="#a9dcc4" font-size="18">alert on your phone</text>
    <rect x="730" y="660" width="240" height="110" rx="14" fill="#161b24" stroke="#8b93a7" stroke-dasharray="7 6"/>
    <text x="756" y="706" font-weight="600">Ollama (optional)</text><text x="756" y="737" fill="#8b93a7" font-size="18">AI hint, advice only</text>
  </g>

  <g fill="none" stroke-width="2.5">
    <path d="M314 332 H380 V385 H412" stroke="#8b93a7" marker-end="url(#g)"/>
    <path d="M314 480 H380 V385" stroke="#8b93a7"/>
    <path d="M314 628 H412" stroke="#8b93a7" marker-end="url(#g)"/>
    <path d="M650 385 H690 V470 H722" stroke="#7aa2ff" marker-end="url(#a)"/>
    <path d="M650 628 H690 V530 H722" stroke="#7aa2ff" marker-end="url(#a)"/>
    <path d="M850 412 V338" stroke="#7aa2ff" marker-end="url(#a)"/>
    <path d="M970 475 H1042" stroke="#7aa2ff" marker-end="url(#a)"/>
    <path d="M1190 530 V582" stroke="#7aa2ff" marker-end="url(#a)"/>
    <path d="M1330 645 H1365 V270 H1338" stroke="#3fb37f" marker-end="url(#a)"/>
    <path d="M1050 660 H978" stroke="#8b93a7" stroke-dasharray="7 6" marker-end="url(#g)"/>
  </g>
  <text x="70" y="830" fill="#8b93a7" font-size="18">The AI hint is labelled and never acts on its own. Alerts are sent even if the model is down.</text>
</svg>
